<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B3FC4"/>
      <stop offset="1" stop-color="#3B2A8F"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="220" fill="#9966FF" opacity="0.25"/>
  <circle cx="80" cy="640" r="180" fill="#4C97FF" opacity="0.18"/>

  <!-- logo mark (favicon identity) -->
  <g transform="translate(70,70) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#855CD6" stroke="#fff" stroke-width="2"/>
    <rect x="8" y="8" width="48" height="48" rx="10" fill="#FFAB19"/>
    <path d="M24 22 L14 32 L24 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 22 L50 32 L40 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="3.5" fill="#fff"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="66" y="305" font-size="112" font-weight="800" letter-spacing="-2">pyScratch</text>
    <text x="70" y="370" font-size="40" font-weight="700" fill="#FFD27A">Python ↔ Scratch 3.0 (.sb3)</text>
    <text x="70" y="425" font-size="28" fill="#E9F1FC">Free online IDE · UA · EN · RU</text>
    <rect x="70" y="490" width="260" height="52" rx="26" fill="#FFAB19"/>
    <text x="200" y="526" font-size="28" font-weight="700" fill="#2B1B66" text-anchor="middle">sivochka.com</text>
  </g>

  <!-- code editor -->
  <g filter="url(#sh)">
    <rect x="620" y="90" width="500" height="190" rx="18" fill="#1E1B3A"/>
    <path d="M620 108 a18 18 0 0 1 18 -18 h464 a18 18 0 0 1 18 18 v22 h-500z" fill="#2E2A55"/>
    <circle cx="646" cy="110" r="7" fill="#FF6B6B"/><circle cx="670" cy="110" r="7" fill="#FFAB19"/><circle cx="694" cy="110" r="7" fill="#59C059"/>
  </g>
  <g font-family="Menlo, Monaco, Courier New, monospace" font-size="27">
    <text x="650" y="177" fill="#FFAB19">@when_flag_clicked</text>
    <text x="650" y="215"><tspan fill="#9966FF">def</tspan><tspan fill="#E9F1FC"> main():</tspan></text>
    <text x="686" y="253"><tspan fill="#4C97FF">move</tspan><tspan fill="#E9F1FC">(</tspan><tspan fill="#59C059">10</tspan><tspan fill="#E9F1FC">)</tspan></text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 300 v50"/><path d="M852 336 l18 20 l18 -20"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.0"/>

  <!-- blocks (drawn bottom-up so tabs overlap notches) -->
  <g filter="url(#sh)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">
    <path d="M640 507 h40 l10 12 h40 l10 -12 h340 v52 h-440z" fill="#59C059"/>
    <text x="664" y="542">say Hello!</text>
    <path d="M640 455 h40 l10 12 h40 l10 -12 h340 v52 h-340 l-10 12 h-40 l-10 -12 h-40z" fill="#4C97FF"/>
    <text x="664" y="490">move</text>
    <rect x="750" y="465" width="64" height="34" rx="17" fill="#fff"/>
    <text x="782" y="490" fill="#2B5FB8" text-anchor="middle">10</text>
    <text x="830" y="490">steps</text>
    <path d="M640 455 v-10 q30 -45 110 -45 h220 q0 0 0 0 q80 0 110 45 v10 h-340 l-10 12 h-40 l-10 -12 h-40z" fill="#FFAB19"/>
    <text x="664" y="436">when ⚑ clicked</text>
  </g>
</svg>
