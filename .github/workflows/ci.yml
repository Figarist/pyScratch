name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax, sitemap.xml and JSON files
        run: |
          for f in js/*.js; do node --check "$f"; done
          node -e "const x=require('fs').readFileSync('sitemap.xml','utf8');const o=(x.match(/<url>/g)||[]).length,c=(x.match(/<\/url>/g)||[]).length;if(!o||o!==c)throw new Error('sitemap.xml: unbalanced <url> entries');console.log('sitemap.xml: '+o+' URLs')"
          for f in package.json site.webmanifest; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
      - name: Run Round-Trip & Runtime Test Suite
        run: node test/test_roundtrip.js
      - name: Run i18n Parity Gate
        run: node scripts/check-i18n.mjs

  notify_failure:
    name: Notify Info on failure
    if: failure()
    needs: [test]
    uses: Figarist/figarist.github.io/.github/workflows/notify-telegram.yml@main
    with:
      title: "pyScratch CI failed on ${{ github.ref_name }}"
      status: "error"
      details: "Commit ${{ github.sha }}"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
